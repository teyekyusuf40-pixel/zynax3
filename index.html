<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>ZYnaX v45 | MULTI-CORE ACCESS</title>
    <style>
        body {
            background-color: #000;
            color: #0f0;
            font-family: 'Consolas', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #matrix { position: fixed; top: 0; left: 0; z-index: -1; opacity: 0.15; }

        .glitch {
            font-size: 70px;
            font-weight: bold;
            text-shadow: 3px 3px #f00, -3px -3px #00f;
            animation: glitch 2s infinite;
            margin-bottom: 20px;
        }

        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }

        /* ANA BUTON */
        .btn-main {
            background: #ff9900;
            color: #000;
            padding: 25px 60px;
            font-size: 30px;
            font-weight: 900;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            box-shadow: 0 0 30px #ff9900;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .btn-main:hover { transform: scale(1.1); box-shadow: 0 0 60px #ff9900; }

        /* SEÇENEK PANELİ (MODAL) */
        #overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        #selection-box {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: #111;
            border: 2px solid #0f0;
            padding: 40px;
            z-index: 101;
            width: 90%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 0 100px rgba(0, 255, 0, 0.2);
        }

        .option-btn {
            display: block;
            width: 100%;
            padding: 20px;
            margin: 15px 0;
            background: transparent;
            border: 1px solid #0f0;
            color: #0f0;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
        }

        .option-btn:hover {
            background: #0f0;
            color: #000;
            box-shadow: 0 0 20px #0f0;
        }

        .close-btn {
            margin-top: 20px;
            color: #f00;
            cursor: pointer;
            font-size: 14px;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <canvas id="matrix"></canvas>

    <div class="glitch">ZYnaX v45</div>
    <button class="btn-main" onclick="panelAc()">SİSTEMİ BAŞLAT</button>

    <div id="overlay" onclick="panelKapat()"></div>
    <div id="selection-box">
        <h2 style="color: #ff9900; margin-bottom: 30px;">VERSİYON SEÇİNİZ</h2>
        
        <a href="ZYnaXPC-NO-SETUP.bat" class="option-btn" download>PORTABLE EDITION (.BAT)</a>
        
        <a href="ZYnaXPC.py" class="option-btn" download>WINDOWS FULL (.PY)</a>
        
        <a href="ZYnaX_Mac.py" class="option-btn" download>macOS VERSION (.PY)</a>

        <div class="close-btn" onclick="panelKapat()">İPTAL ET</div>
    </div>

    <script>
        // Panel Fonksiyonları
        function panelAc() {
            document.getElementById('overlay').style.display = 'block';
            document.getElementById('selection-box').style.display = 'block';
        }
        function panelKapat() {
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('selection-box').style.display = 'none';
        }

        // Matrix Efekti (Arka Plan)
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const letters = "010101ZYNAXERROR777";
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function draw() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#0f0";
            ctx.font = fontSize + "px monospace";
            for (let i = 0; i < drops.length; i++) {
                const text = letters[Math.floor(Math.random() * letters.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(draw, 33);
    </script>
</body>
</html>
