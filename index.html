<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZYnaX v45 | THE CORE BREAKER</title>
    <style>
        /* --- DİNAMİK ARKA PLAN VE YAZI TİPLERİ --- */
        body {
            background: radial-gradient(circle, #050505 0%, #000 100%);
            color: #0f0;
            font-family: 'Consolas', 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .header h1 {
            font-size: 4rem;
            color: #0f0;
            text-shadow: 0 0 10px #0f0, 0 0 20px #0a0, 0 0 40px #050;
            margin: 0;
            letter-spacing: 8px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.02); }
            100% { opacity: 1; transform: scale(1); }
        }

        .status { 
            color: #ff0; 
            font-weight: bold; 
            margin: 20px 0 50px 0; 
            font-size: 18px; 
            text-transform: uppercase;
            border: 1px solid #ff0;
            padding: 5px 15px;
            box-shadow: 0 0 10px #aa0;
        }

        /* --- KART TASARIMLARI (ULTRA KALİTE) --- */
        .wrapper {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 1200px;
        }

        .card {
            background: rgba(15, 15, 15, 0.95);
            border: 1px solid #333;
            width: 350px;
            padding: 40px 20px;
            text-align: center;
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-radius: 8px;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-15px);
            border-color: #777;
            box-shadow: 0 20px 50px rgba(0,0,0,1);
        }

        .win { border-top: 6px solid #f00; }
        .mac { border-top: 6px solid #007aff; }
        .portable { 
            border: 2px solid #ff9900; 
            background: linear-gradient(180deg, #1a1000 0%, #000 100%);
            width: 730px; /* Geniş kart */
        }

        h2 { font-size: 28px; margin-bottom: 15px; }
        .win h2 { color: #f00; text-shadow: 0 0 10px #800; }
        .mac h2 { color: #007aff; text-shadow: 0 0 10px #004; }
        .portable h2 { color: #ff9900; text-shadow: 0 0 15px #640; }

        /* --- PREMIUM BUTONLAR --- */
        .btn {
            padding: 20px 50px;
            border: none;
            font-size: 20px;
            font-weight: 900;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 30px;
            transition: 0.3s;
            text-transform: uppercase;
            width: 80%;
        }

        .win-btn { background: #f00; color: #fff; box-shadow: 0 5px 15px rgba(255,0,0,0.3); }
        .mac-btn { background: #007aff; color: #fff; box-shadow: 0 5px 15px rgba(0,122,255,0.3); }
        .port-btn { background: #ff9900; color: #000; box-shadow: 0 8px 25px rgba(255,153,0,0.4); }

        .btn:hover { filter: brightness(1.3); transform: scale(1.05); box-shadow: 0 0 30px currentColor; }

        /* --- GOOGLE PLAY MODAL (MODERN) --- */
        #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 999; }
        #gpModal {
            display: none; position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 480px; background: #fff; border-radius: 30px 30px 0 0;
            padding: 40px; box-shadow: 0 -10px 100px #000; z-index: 1000; color: #202124;
            font-family: 'Roboto', sans-serif;
        }

        .buy-btn { background: #01875f; color: #fff; width: 100%; padding: 20px; border: none; border-radius: 40px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 30px; }
        
        .sponsor { margin-top: 60px; color: #f00; font-size: 14px; border: 1px dashed #f00; padding: 10px 30px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>ZYnaX v45</h1>
        <div class="status">⚡ CORE STATUS: OPERATIONAL ⚡</div>
    </div>

    <div class="wrapper">
        <div class="card win">
            <h2>WINDOWS</h2>
            <p style="color:#555; font-size: 12px;">PYTHON ENGINE 3.12</p>
            <button onclick="odemeAc('ZYnaXPC.py')" class="btn win-btn">İNDİR (.PY)</button>
        </div>

        <div class="card mac">
            <h2>macOS</h2>
            <p style="color:#555; font-size: 12px;">M1/M2/M3 NEURAL CORE</p>
            <button onclick="odemeAc('ZYnaX_Mac.py')" class="btn mac-btn">İNDİR (.PY)</button>
        </div>

        <div class="card portable">
            <h2>🚀 PORTABLE ACCESS (HIZLI BAŞLAT)</h2>
            <p style="color: #ff9900; font-size: 16px; margin-top: 10px;">⚠️ PYTHON GEREKTİRMEZ - DİREKT ÇALIŞTIR</p>
            <button onclick="odemeAc('ZYnaXPC-NO-SETUP.bat')" class="btn port-btn">SİSTEME DAL (.BAT)</button>
        </div>
    </div>

    <div class="sponsor">SPONSOR: ZYnaX VPN - GÖRÜNMEZ KALKAN AKTİF</div>

    <div id="overlay" onclick="odemeKapat()"></div>
    <div id="gpModal">
        <div style="display: flex; align-items: center; margin-bottom: 25px;">
            <img src="https://upload.wikimedia.org/wikipedia/commons/d/d0/Google_Play_Arrow_logo.svg" width="35" style="margin-right: 20px;">
            <b style="font-size: 22px;">Google Play</b>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 20px;">
            <span id="platformName">ZYnaX v45 Pro</span>
            <b>1,00 TL</b>
        </div>
        <button class="buy-btn" onclick="indirmeyiBaslat()">SİSTEMİ TETİKLE (SATIN AL)</button>
    </div>

    <script>
        let secilenDosya = "";
        function odemeAc(dosyaAdi) {
            secilenDosya = dosyaAdi;
            document.getElementById('platformName').innerText = "ZyNax: " + dosyaAdi;
            document.getElementById('overlay').style.display = 'block';
            document.getElementById('gpModal').style.display = 'block';
        }
        function odemeKapat() {
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('gpModal').style.display = 'none';
        }
        function indirmeyiBaslat() {
            // DOSYA İNDİRME KOMUTU - ELİMİZLE GÜNCELLENDİ
            const link = document.createElement('a');
            link.href = "./" + secilenDosya; // Aynı dizindeki dosyayı hedefle
            link.setAttribute('download', secilenDosya);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            odemeKapat();
        }
    </script>
</body>
</html>
