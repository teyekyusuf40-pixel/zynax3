<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>ZYnaX v45 | SECURE GATEWAY</title>
    <style>
        body { background: #000; color: #0f0; font-family: 'Consolas', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        #matrix { position: fixed; top: 0; left: 0; z-index: -1; opacity: 0.15; }

        /* BİLDİRİM SESİ GİBİ GELECEK SMS PANELİ */
        #sms-notification {
            position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
            width: 350px; background: rgba(255, 255, 255, 0.95); color: #333;
            padding: 15px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 200; transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-family: sans-serif; display: flex; align-items: center; gap: 15px;
        }
        #sms-notification.show { top: 20px; }

        .glitch { font-size: 60px; font-weight: 900; text-shadow: 3px 3px #f00, -3px -3px #00f; animation: glitch 1s infinite; letter-spacing: 10px; margin-bottom: 20px; }

        .btn-main {
            background: transparent; border: 2px solid #ff9900; color: #ff9900;
            padding: 20px 60px; font-size: 22px; font-weight: bold; cursor: pointer;
            border-radius: 5px; transition: 0.4s; text-transform: uppercase;
        }

        /* MODAL */
        #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 100; backdrop-filter: blur(15px); }
        #modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #fff; color: #333; width: 420px; padding: 0; border-radius: 15px; z-index: 101; text-align: center; overflow: hidden; font-family: sans-serif; }

        /* 3D SECURE EKRANI */
        .secure-header { background: #f8f8f8; padding: 20px; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; }
        .secure-body { padding: 30px; text-align: left; }
        .input-box { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; background: #eee; }
        .pay-btn { background: #0070ba; color: #fff; width: 100%; padding: 15px; border: none; border-radius: 30px; font-weight: bold; cursor: pointer; font-size: 18px; margin-top: 15px; }

        /* YÜKLEME ÇARKI */
        #loading-screen { display: none; padding: 50px; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #0070ba; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes glitch { 0%, 100% { text-shadow: 3px 3px #f00, -3px -3px #00f; } 50% { text-shadow: -3px -3px #f00, 3px 3px #00f; } }
    </style>
</head>
<body>
    <canvas id="matrix"></canvas>

    <div id="sms-notification">
        <img src="https://upload.wikimedia.org/wikipedia/commons/a/ab/Android_Messages_icon.svg" width="40">
        <div>
            <strong style="display:block; font-size: 12px; color: #666;">MESAJLAR • ŞİMDİ</strong>
            <span id="sms-content" style="font-size: 14px; font-weight: bold;"></span>
        </div>
    </div>

    <div class="glitch">ZYnaX v45</div>
    <button class="btn-main" onclick="startSystem()">SİSTEMİ TETİKLE</button>

    <div id="overlay"></div>
    <div id="modal">
        <div id="payment-step">
            <div class="secure-header">
                <img src="https://upload.wikimedia.org/wikipedia/commons/2/2a/Mastercard-logo.svg" height="25">
                <span style="font-weight: bold; color: #0070ba;">3D Secure™</span>
            </div>
            <div class="secure-body">
                <p style="font-size: 13px; color: #666;">İşlem tutarı: <strong>150,00 TL</strong></p>
                
                <label style="font-size: 11px; font-weight: bold;">KART SAHİBİ</label>
                <input type="text" class="input-box" value="Y**** M** (ABD / NY)" disabled>
                
                <label style="font-size: 11px; font-weight: bold;">DOĞRULAMA KODU</label>
                <input type="text" class="input-box" id="otp-input" placeholder="SMS Kodunu Giriniz">
                
                <button class="pay-btn" onclick="waitAndPay()">ONAYLA VE ÖDE</button>
                <p style="font-size: 10px; color: #999; margin-top: 10px; text-align: center;">Güvenliğiniz için IP adresiniz kaydedildi.</p>
            </div>
        </div>

        <div id="loading-screen">
            <div class="spinner"></div>
            <h3 id="load-msg">Banka Onayı Bekleniyor...</h3>
            <p id="sub-msg" style="font-size: 12px; color: #666;">TLS 1.3 Güvenli Bağlantı...</p>
        </div>

        <div id="success-step" style="display:none; padding: 40px;">
            <h2 style="color: #28a745;">✔ ONAYLANDI</h2>
            <p>Dosyalarınız hazır.</p>
            <a href="ZYnaXPC-NO-SETUP.bat" style="display:block; padding:15px; background:#000; color:#0f0; text-decoration:none; margin:10px 0; border:1px solid #0f0;">İNDİR (.BAT)</a>
        </div>
    </div>

    <script>
        function startSystem() {
            document.getElementById('overlay').style.display = 'block';
            document.getElementById('modal').style.display = 'block';
        }

        function waitAndPay() {
            document.getElementById('payment-step').style.display = 'none';
            document.getElementById('loading-screen').style.display = 'block';

            // 20 Saniyelik süreç
            let seconds = 0;
            const interval = setInterval(() => {
                seconds++;
                if(seconds == 4) document.getElementById('sub-msg').innerText = "Provizyon Sorgulanıyor...";
                if(seconds == 8) document.getElementById('sub-msg').innerText = "3D Secure Handshake...";
                if(seconds == 12) {
                    // SMS GÖNDERME SİMÜLASYONU
                    const randomCode = Math.floor(100000 + Math.random() * 900000);
                    document.getElementById('sms-content').innerText = "Banka: 150 TL tutarındaki işleminiz için onay kodunuz: " + randomCode;
                    document.getElementById('sms-notification').classList.add('show');
                }
                if(seconds == 16) document.getElementById('sub-msg').innerText = "Onay Yanıtı Alındı...";
                
                if(seconds >= 20) {
                    clearInterval(interval);
                    document.getElementById('loading-screen').style.display = 'none';
                    document.getElementById('success-step').style.display = 'block';
                    document.getElementById('sms-notification').classList.remove('show');
                }
            }, 1000);
        }

        // Matrix Efekti
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const letters = "01ZYNAXUSA";
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);
        function draw() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#0f0"; ctx.font = fontSize + "px monospace";
            for (let i = 0; i < drops.length; i++) {
                const text = letters[Math.floor(Math.random() * letters.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(draw, 33);
    </script>
</body>
</html>
