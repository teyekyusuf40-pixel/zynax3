<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>ZYnaX v45 | COMMAND CENTER</title>
    <style>
        body {
            background-color: #000;
            color: #0f0;
            font-family: 'Consolas', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Matrix Arka Plan */
        #matrix {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
            opacity: 0.15;
        }

        /* Glitch Başlık */
        .glitch {
            font-size: 80px;
            font-weight: bold;
            text-transform: uppercase;
            position: relative;
            text-shadow: 2px 2px #f00, -2px -2px #00f;
            animation: glitch 2s infinite;
        }

        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-3px, 3px); }
            40% { transform: translate(-3px, -3px); }
            60% { transform: translate(3px, 3px); }
            80% { transform: translate(3px, -3px); }
            100% { transform: translate(0); }
        }

        .main-container {
            border: 2px solid #0f0;
            padding: 60px;
            background: rgba(0, 10, 0, 0.9);
            box-shadow: 0 0 50px rgba(0, 255, 0, 0.4);
            text-align: center;
            border-radius: 5px;
        }

        .status-text {
            color: #ff0;
            font-weight: bold;
            letter-spacing: 3px;
            margin-bottom: 30px;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
        }

        /* Premium Turuncu Buton */
        .btn-download {
            display: inline-block;
            background: #ff9900;
            color: #000;
            padding: 25px 60px;
            text-decoration: none;
            font-size: 30px;
            font-weight: 900;
            border-radius: 4px;
            transition: 0.3s;
            box-shadow: 0 0 30px rgba(255, 153, 0, 0.6);
            text-transform: uppercase;
        }

        .btn-download:hover {
            transform: scale(1.15);
            box-shadow: 0 0 60px #ff9900;
            filter: brightness(1.2);
        }

        .hint {
            margin-top: 30px;
            font-size: 11px;
            color: #555;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <canvas id="matrix"></canvas>
    
    <div class="main-container">
        <div class="glitch">ZYnaX v45</div>
        <div class="status-text">BYPASS ENGINE: LOADED</div>
        
        <a href="ZYnaXPC-NO-SETUP.bat" class="btn-download" download>SİSTEMİ BAŞLAT</a>
        
        <div class="hint">Güvenlik uyarısını aşmak için: Sağ tık > Özellikler > Engellemeyi Kaldır</div>
    </div>

    <script>
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$+-*/=%";
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#0f0";
            ctx.font = fontSize + "px monospace";
            for (let i = 0; i < drops.length; i++) {
                const text = letters[Math.floor(Math.random() * letters.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 35);
    </script>
</body>
</html>
