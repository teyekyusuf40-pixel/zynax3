<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZYnaX v45: Multi-Platform Edition</title>
    <style>
        body { background-color: #000; color: #0f0; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 20px; }
        .header h1 { font-size: 3.5rem; color: #0f0; text-shadow: 0 0 20px #0f0; margin-bottom: 5px; letter-spacing: 5px; }
        .status { color: #ff0; font-weight: bold; margin-bottom: 40px; font-size: 16px; text-transform: uppercase; letter-spacing: 2px; }
        .platforms-wrapper { display: flex; gap: 25px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 1100px; }
        .platform-card { flex: 1; min-width: 320px; background: #111; border: 1px solid #333; padding: 40px; text-align: center; transition: 0.4s; border-radius: 4px; }
        .platform-card:hover { transform: translateY(-10px); border-color: #555; box-shadow: 0 15px 35px rgba(0,0,0,0.8); }
        .win-card { border-top: 5px solid #f00; }
        .mac-card { border-top: 5px solid #007aff; }
        .portable-card { border-top: 5px solid #ff9900; margin-top: 30px; max-width: 700px; width: 100%; background: #1a1000; }
        .dl-btn { padding: 18px 40px; border: none; font-size: 18px; font-weight: 900; cursor: pointer; border-radius: 3px; margin-top: 25px; transition: 0.3s; text-transform: uppercase; }
        .win-btn { background: #f00; color: #fff; }
        .mac-btn { background: #007aff; color: #fff; }
        .port-btn { background: #ff9900; color: #000; font-weight: bold; }
        #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 999; }
        #gpModal {
            display: none; position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 450px; background-color: #fff; border-radius: 24px 24px 0 0;
            padding: 30px; box-shadow: 0 -10px 50px #000; z-index: 1000; color: #333;
            animation: slideUp 0.4s ease-out;
        }
        @keyframes slideUp { from { transform: translate(-50%, 100%); } to { transform: translate(-50%, 0); } }
        .buy-btn { background-color: #01875f; color: #fff; width: 100%; padding: 18px; border: none; border-radius: 35px; font-weight: bold; cursor: pointer; margin-top: 25px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>ZYnaX v45</h1>
        <div class="status">OS STATUS: EXPLOIT READY</div>
    </div>

    <div class="platforms-wrapper">
        <div class="platform-card win-card">
            <h2 style="color:#f00">WINDOWS</h2>
            <button onclick="odemeAc('ZYnaXPC.py')" class="dl-btn win-btn">İNDİR (.PY)</button>
        </div>
        <div class="platform-card mac-card">
            <h2 style="color:#007aff">macOS</h2>
            <button onclick="odemeAc('ZYnaX_Mac.py')" class="dl-btn mac-btn">İNDİR (.PY)</button>
        </div>
    </div>

    <div class="platform-card portable-card">
        <h2 style="color:#ff9900">PORTABLE EDITION</h2>
        <p style="color: #ff9900; font-weight: bold;">⚠️ PYTHON GEREKTİRMEZ</p>
        <button onclick="odemeAc('ZYnaXPC-NO-SETUP.bat')" class="dl-btn port-btn">HIZLI BAŞLAT (.BAT)</button>
    </div>

    <div id="overlay" onclick="odemeKapat()"></div>
    <div id="gpModal">
        <div style="display: flex; align-items: center; margin-bottom: 20px;">
            <img src="https://upload.wikimedia.org/wikipedia/commons/d/d0/Google_Play_Arrow_logo.svg" width="30" style="margin-right: 15px;">
            <b style="font-size: 20px;">Google Play</b>
        </div>
        <div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
            <span id="platformName">ZYnaX Pro</span>
            <b>1,00 TL</b>
        </div>
        <button class="buy-btn" onclick="indirmeyiBaslat()">TEK TIKLA SATIN AL</button>
    </div>

    <script>
        let secilenDosya = "";
        function odemeAc(dosyaAdi) {
            secilenDosya = dosyaAdi;
            document.getElementById('platformName').innerText = "ZYnaX (" + dosyaAdi + ")";
            document.getElementById('overlay').style.display = 'block';
            document.getElementById('gpModal').style.display = 'block';
        }
        function odemeKapat() {
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('gpModal').style.display = 'none';
        }
        function indirmeyiBaslat() {
            const link = document.createElement('a');
            // GitHub üzerindeki dosyaya doğrudan erişim için:
            link.href = secilenDosya;
            link.setAttribute('download', secilenDosya);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            odemeKapat();
        }
    </script>
</body>
</html>
